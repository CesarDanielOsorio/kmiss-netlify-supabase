[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = "/api"
  # Son opciones públicas de configuración, no credenciales.
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,IMAGE_STORAGE,SUPABASE_STORAGE_BUCKET"

[functions]
  node_bundler = "esbuild"
  included_files = ["backend/certs/*.crt"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
